
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estimation Travaux - LUVA BAT</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #f9fafb;
      padding: 40px 20px;
      color: #111827;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-align: center;
    }
    label {
      display: block;
      margin: 15px 0 5px;
    }
    select, input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
    }
    button {
      background-color: #1e3a8a;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    button:hover {
      background-color: #3749a3;
    }
    .step {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    .step.active {
      display: block;
    }
    #result {
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      margin-top: 20px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Estimez votre projet</h2>
    <div class="step active" id="step1">
      <label>Quel type d'habitat ?</label>
      <select id="habitat">
        <option value="appartement">Appartement</option>
        <option value="maison">Maison</option>
        <option value="local">Local professionnel</option>
      </select>
      <button onclick="nextStep(2)">Suivant</button>
    </div>

    <div class="step" id="step2">
      <label>État du logement</label>
      <select id="etat">
        <option value="rafraichir">À rafraîchir</option>
        <option value="renover">À rénover complètement</option>
      </select>
      <button onclick="nextStep(3)">Suivant</button>
    </div>

    <div class="step" id="step3">
      <label>Surface en m²</label>
      <input type="number" id="surface" placeholder="Ex: 45" />
      <button onclick="nextStep(4)">Suivant</button>
    </div>

    <div class="step" id="step4">
      <label>Type de travaux</label>
      <select id="type">
        <option value="peinture">Peinture</option>
        <option value="salle_de_bain">Salle de bain</option>
        <option value="cuisine">Cuisine</option>
        <option value="sol">Pose de sol</option>
      </select>
      <button onclick="nextStep(5)">Suivant</button>
    </div>

    <div class="step" id="step5">
      <label>Niveau de gamme</label>
      <select id="gamme">
        <option value="standard">Standard</option>
        <option value="moyen">Moyen</option>
        <option value="premium">Haut de gamme</option>
      </select>
      <button onclick="calculerEstimation()">Voir mon estimation</button>
    </div>

    <div class="step" id="resultStep">
      <h3>Votre estimation</h3>
      <div id="result"></div>
      <br>
      <button onclick="window.location.href='contact.html'">Je souhaite un devis précis</button>
    </div>
  </div>

  <script>
    function nextStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + step).classList.add('active');
    }

    function calculerEstimation() {
      const type = document.getElementById('type').value;
      const gamme = document.getElementById('gamme').value;
      const surface = parseFloat(document.getElementById('surface').value);

      if (isNaN(surface) || surface <= 0) {
        alert("Veuillez entrer une surface valide.");
        return;
      }

      let tarifs = {
        peinture: { standard: [25, 35], moyen: [35, 45], premium: [45, 60] },
        salle_de_bain: { standard: [400, 600], moyen: [600, 800], premium: [800, 1200] },
        cuisine: { standard: [350, 500], moyen: [500, 700], premium: [700, 1000] },
        sol: { standard: [30, 50], moyen: [50, 70], premium: [70, 90] }
      };

      const [min, max] = tarifs[type][gamme];
      const totalMin = min * surface;
      const totalMax = max * surface;

      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('resultStep').classList.add('active');
      document.getElementById('result').innerText =
        `Estimation entre ${totalMin.toLocaleString()}€ et ${totalMax.toLocaleString()}€ TTC`;
    }
  </script>
</body>
</html>
