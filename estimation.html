
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulateur LUVA BAT</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://images.pexels.com/photos/271800/pexels-photo-271800.jpeg') no-repeat center center fixed;
      background-size: cover;
    }
    .options label {
      transition: all 0.2s ease;
    }
    .options input[type="checkbox"]:checked + label {
      background-color: #c7d2fe;
      border: 2px solid #1e3a8a;
    }
    
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Manrope', sans-serif;
      margin: 0;
      padding: 0;
      background: #f9fafb;
      color: #1f2937;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }
    .step img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    .options label {
      display: inline-block;
      margin-right: 15px;
      margin-bottom: 10px;
      padding: 10px 15px;
      background: #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
    }
    .options input[type="checkbox"] {
      display: none;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
    }
    .buttons button {
      width: 48%;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="step active" id="step1">
      <h2>Quels travaux souhaitez-vous réaliser ?</h2>
      <img src="https://images.pexels.com/photos/1457842/pexels-photo-1457842.jpeg" alt="Salle de bain moderne"/>
      <div class="options">
        <label><input type="checkbox" name="travaux" value="salle_de_bain"/>🛁 Salle de bain</label>
        <label><input type="checkbox" name="travaux" value="cuisine"/>🍽️ Cuisine</label>
        <label><input type="checkbox" name="travaux" value="peinture"/>🎨 Peinture</label>
        <label><input type="checkbox" name="travaux" value="electricite"/>🔌 Électricité</label>
        <label><input type="checkbox" name="travaux" value="sol"/>🧱 Sols</label>
        <label><input type="checkbox" name="travaux" value="isolation"/>🔊 Isolation</label>
      </div>
      <div class="buttons">
        <button disabled>Précédent</button>
        <button onclick="nextStep(2)">Suivant</button>
      </div>
    </div>

    <div class="step" id="step2">
      <h2>Quel niveau de finition recherchez-vous ?</h2>
      <select id="niveau">
        <option value="essentiel">Essentiel - Simple et fonctionnel</option>
        <option value="confort">Confort - Équilibre qualité/prix</option>
        <option value="premium">Premium - Haut de gamme</option>
      </select>
      <div class="buttons">
        <button onclick="prevStep(1)">Précédent</button>
        <button onclick="nextStep(3)">Suivant</button>
      </div>
    </div>

    <div class="step" id="step3">
      <h2>Indiquez la surface concernée (en m²)</h2>
      <input type="number" id="surface" placeholder="Ex : 45" />
      <div class="buttons">
        <button onclick="prevStep(2)">Précédent</button>
        <button onclick="nextStep(4)">Suivant</button>
      </div>
    </div>

    <div class="step" id="step4">
      <h2>Avant de voir votre estimation</h2>
      <p>Entrez votre email pour recevoir un devis détaillé si vous le souhaitez :</p>
      <input type="email" id="email" placeholder="Votre email" required />
<input type="tel" id="phone" placeholder="Votre téléphone" required />
      <div class="buttons">
        <button onclick="prevStep(3)">Précédent</button>
        <button onclick="showEstimation()">Voir mon estimation</button>
      </div>
    </div>

    <div class="step" id="step5">
      <h2>Voici votre estimation</h2>
      <p id="result"></p>
      <button onclick="window.location.href='contact.html'">Je souhaite un devis précis</button>
    </div>
  </div>

  <script>
    function nextStep(num) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step' + num).classList.add('active');
    }

    function prevStep(num) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step' + num).classList.add('active');
    }

    function showEstimation() {
      const surface = parseFloat(document.getElementById('surface').value);
      const gamme = document.getElementById('niveau').value;
      const travaux = [...document.querySelectorAll('input[name=travaux]:checked')].map(el => el.value);

      if (!surface || travaux.length === 0) {
        alert("Merci de remplir tous les champs");
        return;
      }

      let totalMin = 0, totalMax = 0;
      const base = {
        salle_de_bain: [400, 800],
        cuisine: [350, 700],
        peinture: [25, 45],
        electricite: [80, 120],
        sol: [30, 60],
        isolation: [50, 90]
      };
      const coeff = { essentiel: 1, confort: 1.2, premium: 1.5 };

      travaux.forEach(t => {
        const [min, max] = base[t];
        totalMin += min * surface;
        totalMax += max * surface;
      });

      totalMin *= coeff[gamme];
      totalMax *= coeff[gamme];

      document.getElementById('result').innerText =
        `Votre estimation se situe entre ${Math.round(totalMin).toLocaleString()} € et ${Math.round(totalMax).toLocaleString()} € TTC`;

      
    // Envoi vers Make webhook
    fetch('https://hook.eu2.make.com/4ssins571cvc5910brb3k3ad7qq096oj', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        travaux: [...document.querySelectorAll('input[name=travaux]:checked')].map(el => el.value),
        surface: surface,
        niveau: gamme,
        phone: document.getElementById('phone').value
      })
    }).then(() => {
      nextStep(5);
    }).catch(() => {
      alert("Erreur lors de l'envoi. Merci de réessayer.");
    });
    
    }
  </script>
</body>
</html>
