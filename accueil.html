
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVA BAT - Bienvenue</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1581093448798-a94a56c7d68b') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 10px;
      color: white;
      text-align: center;
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      max-width: 300px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }
    button {
      background-color: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h2>Estimez vos travaux</h2>
    <p>Renseignez vos coordonnées pour commencer</p>
    <input type="email" id="email" placeholder="Votre email" required />
    <input type="tel" id="phone" placeholder="Votre téléphone" required />
    <button onclick="goToEstimation()">J’estime mes travaux</button>
  </div>

  <script>
    function goToEstimation() {
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      if (email && phone) {
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        window.location.href = 'estimation.html';
      } else {
        alert('Veuillez remplir tous les champs');
      }
    }
  </script>
</body>
</html>
