<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LUVA BAT - Estimation Interactive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f0f2f5; color: #333; overflow-x: hidden; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1, h2, h3 { font-weight: 600; }
    button { font-family: inherit; }
    /* Hero */
    .hero { position: relative; height: 60vh; background: url('https://source.unsplash.com/1600x900/?renovation') center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .hero h1 { font-size: 3rem; animation: fadeInDown 1s ease-out; }
    .hero p { font-size: 1.2rem; margin-top: 10px; animation: fadeInUp 1s 0.5s ease-out forwards; opacity: 0; }
    @keyframes fadeInDown { from {opacity:0; transform: translateY(-20px);} to {opacity:1; transform: translateY(0);} }
    @keyframes fadeInUp { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }
    .btn-primary { display: inline-block; padding: 12px 28px; margin-top: 20px; background: #1e3a8a; color: #fff; border-radius: 30px; text-decoration: none; transition: background .3s, transform .3s; }
    .btn-primary:hover { background: #16306b; transform: translateY(-3px); }
    /* Steps */
    #progress { height: 6px; background: #ddd; border-radius: 3px; overflow: hidden; margin: 30px 0; }
    #progress div { height: 100%; width: 0; background: #1e3a8a; transition: width .5s; }
    .step { display: none; animation: fadeIn 0.5s ease-out; }
    .step.active { display: block; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); margin-bottom: 20px; transform: translateY(20px); opacity: 0; animation: cardIn 0.5s forwards; }
    @keyframes cardIn { to { transform: translateY(0); opacity: 1; } }
    .options { display: flex; flex-wrap: wrap; gap: 12px; }
    .options input { display: none; }
    .options label { flex: 1; padding: 12px; background: #f7f9fc; border: 2px solid transparent; border-radius: 8px; text-align: center; cursor: pointer; transition: all .3s; }
    .options input:checked + label { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 6px; }
    .buttons { display: flex; justify-content: space-between; gap: 10px; }
    .buttons button { flex: 1; padding: 12px; background: #1e3a8a; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background .3s; }
    .buttons button:disabled { background: #ccc; cursor: not-allowed; }
    .buttons button:hover:not(:disabled) { background: #16306b; }
    /* Footer */
    footer { text-align: center; padding: 20px; font-size: 0.9rem; color: #777; }
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <div class="container text-center">
      <h1>Estimez vos travaux en quelques clics</h1>
      <p>Rénovation, plomberie, électricité... Obtenez une fourchette de prix instantanée.</p>
      <a href="#step1" class="btn-primary" id="startBtn">Commencer</a>
    </div>
  </section>

  <div class="container">
    <!-- Progress -->
    <div id="progress"><div></div></div>

    <!-- Steps -->
    <div class="step active" id="step1">
      <div class="card">
        <h2>1. Sélectionnez la pièce</h2>
        <div class="options">
          <input type="checkbox" id="room1"><label for="room1">Salle de bain</label>
          <input type="checkbox" id="room2"><label for="room2">Cuisine</label>
          <input type="checkbox" id="room3"><label for="room3">Salon</label>
          <input type="checkbox" id="room4"><label for="room4">Chambre</label>
          <input type="checkbox" id="room5"><label for="room5">Entrée</label>
        </div>
        <div class="buttons">
          <button disabled>Précédent</button>
          <button id="next1">Suivant</button>
        </div>
      </div>
    </div>

    <div class="step" id="step2">
      <div class="card">
        <h2>2. Détails de la pièce</h2>
        <form id="detailsForm"></form>
        <div class="buttons">
          <button id="prev2">Précédent</button>
          <button id="next2">Suivant</button>
        </div>
      </div>
    </div>

    <div class="step" id="step3">
      <div class="card">
        <h2>3. Niveau de finition</h2>
        <select id="niveau">
          <option value="">-- Sélectionnez --</option>
          <option value="essentiel">Essentiel</option>
          <option value="confort">Confort</option>
          <option value="premium">Premium</option>
        </select>
        <div class="buttons">
          <button id="prev3">Précédent</button>
          <button id="next3">Suivant</button>
        </div>
      </div>
    </div>

    <div class="step" id="step4">
      <div class="card">
        <h2>4. Vos coordonnées</h2>
        <input type="email" id="email" placeholder="Votre email">
        <input type="tel" id="phone" placeholder="Votre téléphone">
        <div class="buttons">
          <button id="prev4">Précédent</button>
          <button id="next4">Voir estimation</button>
        </div>
      </div>
    </div>

    <div class="step" id="step5">
      <div class="card">
        <h2>5. Votre estimation</h2>
        <p id="result" style="font-weight:600; font-size:1.2rem;"></p>
        <div class="buttons">
          <button onclick="location.href='contact.html'">Demander un devis</button>
        </div>
      </div>
    </div>
  </div>

  <footer>© 2025 LUVA BAT - Tous droits réservés</footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Animated start scroll
      document.getElementById('startBtn').addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('step1').scrollIntoView({behavior:'smooth'});
      });

      const rooms = ['room1','room2','room3','room4','room5'];
      const tasks = {
        room1:['peinture','carrelage','plomberie','electricite','maconnerie','etancheite'],
        room2:['peinture','carrelage','plomberie','electricite','menuiserie','maconnerie'],
        room3:['peinture','parquet','electricite','menuiserie','maconnerie'],
        room4:['peinture','parquet','electricite','menuiserie','maconnerie'],
        room5:['peinture','carrelage','electricite','maconnerie']
      };
      const rates = {peinture:[35,65],carrelage:[40,90],parquet:[60,100],
        plomberie:[200,350],electricite:[100,200],menuiserie:[250,500],
        maconnerie:[900,2200],etancheite:[50,120]};
      let min=0,max=0;

      const go = step => {
        document.querySelectorAll('.step').forEach(el=>el.classList.remove('active'));
        document.getElementById('step'+step).classList.add('active');
        document.querySelector('#progress div').style.width = ((step-1)*25)+'%';
      };

      const gen = () => {
        const sel = rooms.filter(id=>document.getElementById(id).checked);
        const f = document.getElementById('detailsForm'); f.innerHTML='';
        sel.forEach(id=>{
          const name = document.querySelector('label[for="'+id+'"]').innerText;
          let html = `<fieldset><legend>${name}</legend>
            <label>Surface (m²):<input type="number" name="surf_${id}" min="1" required></label><p>Travaux :</p>`;
          tasks[id].forEach(t=>{
            html+=`<label><input type="checkbox" name="type_${id}" value="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</label>`;
          });
          html+='</fieldset>';
          f.innerHTML+=html;
        });
      };

      const valid2 = () => {
        const sel = rooms.filter(id=>document.querySelector(`[name="surf_${id}"]`));
        for(const id of sel){
          const s = document.querySelector(`[name="surf_${id}"]`).value;
          if(!s||s<=0){ alert('Surface invalide'); return false; }
          if(!document.querySelector(`[name="type_${id}"]:checked`)){ alert('Sélectionnez un travail'); return false; }
        }
        return true;
      };

      function sendLead() {
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        fetch('https://hook.eu2.make.com/4ssins571cvc5910brb3k3ad7qq096oj', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email, phone})
        });
      }

      const calc = () => {
        min=0; max=0;
        rooms.forEach(id=>{
          if(document.getElementById(id).checked){
            const surf = parseFloat(document.querySelector(`[name="surf_${id}"]`).value);
            document.querySelectorAll(`[name="type_${id}"]:checked`).forEach(cb=>{
              const r = rates[cb.value] || [0,0];
              min += r[0] * surf; max += r[1] * surf;
            });
          }
        });
        document.getElementById('result').innerText = `Entre ${Math.round(min).toLocaleString()}€ et ${Math.round(max).toLocaleString()}€ TTC`;
      };

      document.getElementById('next1').onclick = () => {
        if(!rooms.some(id=>document.getElementById(id).checked)) alert('Choisissez une pièce');
        else { gen(); go(2); }
      };
      document.getElementById('prev2').onclick = () => go(1);
      document.getElementById('next2').onclick = () => valid2() && go(3);
      document.getElementById('prev3').onclick = () => go(2);
      document.getElementById('next3').onclick = () => {
        if(!document.getElementById('niveau').value) alert('Choisissez un niveau'); else go(4);
      };
      document.getElementById('prev4').onclick = () => go(3);
      document.getElementById('next4').onclick = () => {
        if(!document.getElementById('email').value||!document.getElementById('phone').value) alert('Coordonnées'); 
        else { sendLead(); calc(); go(5); }
      };

      // Phone formatting
      document.getElementById('phone').addEventListener('input', e=> {
        let d = e.target.value.replace(/\D/g,'');
        e.target.value = d.match(/.{1,2}/g)?.join(' ')||d;
      });

      go(1);
    });
  </script>
</body>
</html>
