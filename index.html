
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUVA BAT - Estimation Travaux</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Manrope', sans-serif;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.55);
      z-index: 1;
    }
    .form-container {
      position: relative;
      z-index: 2;
      background: white;
      padding: 50px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }
    .form-container h1 {
      font-size: 2rem;
      color: #1f2937;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .form-container p {
      margin-bottom: 30px;
      color: #4b5563;
    }
    .form-container input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
    }
    .form-container button {
      width: 100%;
      padding: 14px;
      background-color: #1e3a8a;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .form-container button:hover {
      background-color: #3749a3;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="form-container">
    <h1>Obtenez votre estimation</h1>
    <p>Commencez par renseigner vos coordonnées</p>
    <form id="leadForm">
      <input type="email" name="email" id="email" placeholder="Adresse email" required />
      <input type="tel" name="phone" id="phone" placeholder="Téléphone" required />
      <button type="submit">J’estime mes travaux</button>
    </form>
  </div>

  <script>
    document.getElementById('leadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;

      localStorage.setItem('email', email);
      localStorage.setItem('phone', phone);

      fetch('https://hook.eu2.make.com/4ssins571cvc5910brb3k3ad7qq096oj', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email: email, phone: phone })
      }).then(() => {
        window.location.href = 'estimation.html';
      }).catch(() => {
        alert('Erreur lors de l’envoi. Veuillez réessayer.');
      });
    });
  </script>
</body>
</html>
