<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Contact LUVA BAT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;background:#f0f2f5;margin:0;color:#333;}
  .container{max-width:500px;margin:40px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.1);}
  input,textarea,button{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px;}
  button{background:#1e3a8a;color:#fff;border:none;padding:12px;border-radius:6px;cursor:pointer;transition:background .3s;}
  button:hover{background:#16306b;}
</style>
</head>
<body>
  <div class="container">
    <h1>Contactez-nous</h1>
    <form action="https://formspree.io/f/mrbqperr" method="POST">
      <input type="text" name="name" placeholder="Votre nom" required>
      <input type="email" name="email" placeholder="Votre email" required>
      <textarea name="message" rows="5" placeholder="Votre message"></textarea>
      <button type="submit">Envoyer</button>
    </form>
  </div>
</body>
</html>
